name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dt
          POSTGRES_PASSWORD: dt_test_password
          POSTGRES_DB: delicate_trader_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://dt:dt_test_password@localhost:5432/delicate_trader_test
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: development
      JWT_SECRET_KEY: test-secret-key-not-for-production
      AGENT_SECRET_ENCRYPTION_KEY: test-encryption-key-not-for-production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Ruff check
        working-directory: backend
        run: ruff check . && ruff format --check .

      - name: mypy --strict on domain/ and engines/
        working-directory: backend
        run: mypy --strict app/domain app/engines

      - name: mypy on the rest
        working-directory: backend
        run: mypy app

      - name: import-linter contracts
        working-directory: backend
        run: lint-imports

      - name: Purity grep
        run: python3 scripts/check_purity.py

      - name: Alembic upgrade / downgrade / upgrade round-trip
        working-directory: backend
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: pytest unit
        working-directory: backend
        run: pytest tests/unit -m unit -q

      - name: pytest integration
        working-directory: backend
        run: pytest tests/integration -m integration -q

      - name: pytest golden
        working-directory: backend
        run: pytest tests/golden -m golden -q

      - name: Coverage gate
        working-directory: backend
        run: |
          pytest --cov=app --cov-branch --cov-report=term-missing \
            --cov-fail-under=85 \
            tests/unit tests/integration tests/golden

      - name: Coverage gate - engines/risk (100% branch)
        working-directory: backend
        run: |
          pytest --cov=app.engines.risk --cov-branch \
            --cov-report=term-missing --cov-fail-under=100 \
            tests/unit tests/golden

      - name: Coverage gate - execution/ (100% branch, once implemented)
        working-directory: backend
        run: |
          if [ -d app/execution ] && find app/execution -name '*.py' ! -name '__init__.py' | grep -q .; then
            pytest --cov=app.execution --cov-branch \
              --cov-report=term-missing --cov-fail-under=100 \
              tests/unit tests/integration
          else
            echo "::warning::app/execution has no implementation yet (MVP scope, see SPEC-10 Phase 4+) - skipping coverage gate"
          fi

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install agent
        working-directory: agent
        run: pip install -e ".[dev]"

      - name: Ruff check
        working-directory: agent
        run: ruff check . && ruff format --check .

      - name: mypy
        working-directory: agent
        run: mypy .

      - name: pytest
        working-directory: agent
        run: pytest -q
