[project]
name = "delicate-trader-backend"
version = "0.1.0"
description = "DelicateTrader autonomous trading platform - backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "gunicorn>=23.0,<24.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "alembic>=1.13,<2.0",
    "asyncpg>=0.29,<0.30",
    "psycopg[binary]>=3.2,<4.0",
    "redis>=5.1,<6.0",
    "structlog>=24.4,<25.0",
    "uuid6>=2024.7.10",
    "pyyaml>=6.0,<7.0",
    "argon2-cffi>=23.1,<24.0",
    "pyjwt>=2.9,<3.0",
    "cryptography>=41,<45",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7,<0.8",
    "mypy>=1.12,<2.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=5.0,<6.0",
    "hypothesis>=6.115,<7.0",
    "import-linter>=2.1,<3.0",
    "types-PyYAML",
    "httpx>=0.27,<0.28",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Raw SQL DDL statements (CREATE TABLE PARTITION OF, CREATE RULE) - line
# length here is dictated by the SQL statement itself, not Python style.
"migrations/versions/0001_initial_schema.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
mypy_path = "app"
warn_return_any = true
warn_unused_configs = true
no_implicit_optional = true
strict_equality = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["app.domain.*", "app.engines.*"]
strict = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: fast, no external services",
    "integration: requires postgres and redis",
    "golden: engine golden-fixture tests",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain imports nothing from the project"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = [
    "app.engines", "app.api", "app.core", "app.execution",
    "app.research", "app.workers", "app.models", "app.repositories", "app.services",
]

[[tool.importlinter.contracts]]
name = "engines import only domain"
type = "forbidden"
source_modules = ["app.engines"]
forbidden_modules = [
    "app.api", "app.execution", "app.research", "app.workers",
    "app.models", "app.repositories", "app.services",
    "sqlalchemy", "redis", "httpx", "fastapi",
]

[[tool.importlinter.contracts]]
name = "nothing imports api"
type = "forbidden"
source_modules = [
    "app.domain", "app.engines", "app.execution", "app.research",
    "app.workers", "app.models", "app.repositories", "app.services", "app.core",
]
forbidden_modules = ["app.api"]

[[tool.importlinter.contracts]]
name = "layering: domain -> engines -> repositories -> (execution, research, services, workers) -> api"
type = "layers"
layers = [
    "app.api",
    "app.services",
    "app.execution | app.research | app.workers",
    "app.repositories",
    "app.engines",
    "app.domain",
]
